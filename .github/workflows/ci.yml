name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # Playwright is optional for SPA ingest; core tests do not require browsers.
          pip install langchain-text-splitters tiktoken numpy
      - name: Compile
        run: python -m compileall src/rag_assistant
      - name: Unit tests (offline)
        run: |
          python -m unittest tests.test_ingestion tests.test_chunking.TestChunkingPipeline.test_structure_aware_chunking_preserves_hierarchy tests.test_chunking.TestChunkingPipeline.test_tiny_section_merging tests.test_chunking.TestChunkingPipeline.test_chunking_is_deterministic tests.test_chunking.TestChunkingPipeline.test_oversized_section_subdivision tests.test_retrieval -v
